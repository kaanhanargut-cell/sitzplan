<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Sitzplan</title>
<meta name="claude:viewport-fit-sides" content="cover">

<style>
/* Layout: one-screen tool — top bar, side panel of actions, the classroom grid as the stage. Board at the top = front. */
:root{
  --bg:#F2F3EF; --panel:#FFFFFF; --ink:#1B2220; --muted:#5C6964; --line:#D6DBD5;
  --accent:#2C58B8; --accent-ink:#FFFFFF; --accent-soft:#E3EAF8;
  --floor:#E9ECE6; --wall:#B9C1BA;
  --desk:#EADBBE; --desk-line:#C2A877; --teacher:#BE9461; --teacher-ink:#2A1E10;
  --board:#2F5446; --board-ink:#E6F0EA; --glass:#D4E6F2; --glass-line:#9FC2DA;
  --lock:#B86E0A; --danger:#B3261E; --ok:#2E7D4F; --chip:#FFFFFF;
  --font-display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --font-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141917; --panel:#1C2321; --ink:#E5ECE8; --muted:#97A59F; --line:#2E3936;
  --accent:#86A7F2; --accent-ink:#0D1424; --accent-soft:#22304D;
  --floor:#181E1C; --wall:#3A4642;
  --desk:#4B402F; --desk-line:#7A6646; --teacher:#7D5E3A; --teacher-ink:#F3E6D4;
  --board:#3A6A57; --board-ink:#E6F0EA; --glass:#1F3442; --glass-line:#3C6580;
  --lock:#E8A443; --danger:#F08A80; --ok:#6CC08E; --chip:#25302D; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141917; --panel:#1C2321; --ink:#E5ECE8; --muted:#97A59F; --line:#2E3936;
  --accent:#86A7F2; --accent-ink:#0D1424; --accent-soft:#22304D;
  --floor:#181E1C; --wall:#3A4642;
  --desk:#4B402F; --desk-line:#7A6646; --teacher:#7D5E3A; --teacher-ink:#F3E6D4;
  --board:#3A6A57; --board-ink:#E6F0EA; --glass:#1F3442; --glass-line:#3C6580;
  --lock:#E8A443; --danger:#F08A80; --ok:#6CC08E; --chip:#25302D; color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.45}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;margin:0;line-height:1.15}

.app{height:100%;display:grid;grid-template-rows:auto 1fr;min-height:0}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding-block:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:var(--panel);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--font-display);font-weight:700;font-size:19px;letter-spacing:-.01em}
.brand svg{flex:none}
.clsPick{display:flex;align-items:center;gap:6px}
select,input[type=text],input[type=number],textarea{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:7px 9px;min-width:0}
textarea{width:100%;resize:vertical}
.tabs{display:flex;gap:2px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:3px}
.tabs button{border:0;background:transparent;padding:6px 14px;border-radius:999px;color:var(--muted);font-weight:700}
.tabs button[aria-selected=true]{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0 / .12)}
.spacer{flex:1}
.status{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.status.live .dot{background:var(--ok)} .status.warn .dot{background:var(--lock)}
.lang{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.lang button{border:0;background:transparent;padding:4px 9px;font-size:13px;font-weight:700;color:var(--muted)}
.lang button[aria-pressed=true]{background:var(--ink);color:var(--bg)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:var(--panel);
  border-radius:var(--r);padding:8px 12px;font-weight:700;min-height:40px;text-align:left}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--danger)}
.btn.danger.solid{background:var(--danger);color:var(--panel);border-color:var(--danger)}
.btn.ghost{border-color:transparent;background:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn svg{flex:none}

.main{display:grid;grid-template-columns:300px minmax(0,1fr);min-height:0}
.side{background:var(--panel);border-right:1px solid var(--line);overflow:auto;padding:16px;display:flex;flex-direction:column;gap:18px;min-height:0}
.stage{overflow:auto;display:flex;padding:20px;min-height:0;min-width:0}
.stageInner{margin:auto;display:flex;flex-direction:column;align-items:center;gap:8px}
.sec{display:flex;flex-direction:column;gap:8px}
.sec h3{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-family:var(--font-body);font-weight:700}
.meta{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.stack{display:flex;flex-direction:column;gap:6px}
.stack .btn{justify-content:flex-start;width:100%}
.clsTitle{font-size:24px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:700}
label.f > *{color:var(--ink);font-weight:400}
.hint{font-size:13px;color:var(--muted)}
.warn{font-size:13px;color:var(--lock);font-weight:700}

/* pool of unseated students */
.pool{min-height:64px;border:2px dashed var(--line);border-radius:var(--r);padding:8px;display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start}
.pool.over{border-color:var(--accent);background:var(--accent-soft)}
.pool .empty{color:var(--muted);font-size:13px;padding:4px}
.chip{touch-action:none;user-select:none;-webkit-user-select:none;display:inline-flex;align-items:center;justify-content:center;
  min-width:44px;height:36px;padding:0 10px;border-radius:6px;border:1px solid var(--desk-line);background:var(--desk);font-weight:700;letter-spacing:.02em;cursor:grab}
.chip.sel{outline:3px solid var(--accent);outline-offset:1px}
.ghost{position:fixed;z-index:50;pointer-events:none;transform:translate(-50%,-60%) rotate(-3deg);box-shadow:0 8px 20px rgb(0 0 0 / .25);cursor:grabbing}

/* classroom grid */
.frontLabel{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:700}
.grid{--cell:56px;display:grid;padding:10px;background:var(--floor);border:2px solid var(--wall);border-radius:6px;
  background-image:radial-gradient(var(--line) 1px,transparent 1.2px);background-size:var(--cell) var(--cell);background-position:10px 10px}
.cell{width:var(--cell);height:var(--cell);position:relative}
.fill{position:absolute;inset:4px;border-radius:5px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.cell.jl .fill{left:0;border-top-left-radius:0;border-bottom-left-radius:0}
.cell.jr .fill{right:0;border-top-right-radius:0;border-bottom-right-radius:0}
.cell.jt .fill{top:0;border-top-left-radius:0;border-top-right-radius:0}
.cell.jb .fill{bottom:0;border-bottom-left-radius:0;border-bottom-right-radius:0}
.seat .fill{background:var(--desk);border:1px solid var(--desk-line)}
.seat.jl .fill{border-left:1px dashed var(--desk-line)}
.seat.jr .fill{border-right:0}
.seat.jt .fill{border-top:1px dashed var(--desk-line)}
.seat.jb .fill{border-bottom:0}
.window.jl .fill{border-left:0} .window.jr .fill{border-right:0}
.window.jt .fill{border-top:0} .window.jb .fill{border-bottom:0}
.window.vert .fill{background:repeating-linear-gradient(0deg,var(--glass) 0 7px,var(--glass-line) 7px 8px)}
.board .fill{background:var(--board);color:var(--board-ink)}
.teacher .fill{background:var(--teacher);color:var(--teacher-ink)}
.window .fill{background:repeating-linear-gradient(90deg,var(--glass) 0 7px,var(--glass-line) 7px 8px);border:1px solid var(--glass-line)}
.door .fill{color:var(--muted)}
.lbl{font-size:max(10px,calc(var(--cell) * .2));text-transform:uppercase;letter-spacing:.1em;font-weight:700;white-space:nowrap;position:absolute;left:8px}
.code{font-weight:700;font-size:clamp(11px,calc(var(--cell) * .3),44px);letter-spacing:.02em;user-select:none;-webkit-user-select:none;touch-action:none;
  width:100%;height:100%;display:flex;align-items:center;justify-content:center;cursor:grab;padding:0 2px;text-align:center;line-height:1.05;overflow-wrap:anywhere}
.pin{position:absolute;top:2px;right:3px;width:max(10px,calc(var(--cell)*.2));height:max(10px,calc(var(--cell)*.2));color:var(--lock)}
.seat.sel .fill{outline:3px solid var(--accent);outline-offset:-1px;z-index:2}
.seat.over .fill{outline:3px dashed var(--accent);outline-offset:-1px;z-index:2}
.seat.locked .code{cursor:not-allowed}
.grid.plan .seat:not(.taken) .fill{background:color-mix(in srgb,var(--desk) 55%,var(--floor))}
.grid.edit .cell{cursor:crosshair;touch-action:none}
.grid.edit .floor .fill{border:1px dashed var(--line)}
.grid.edit .floor:hover .fill{background:var(--accent-soft)}

/* room editor tools */
.tools{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.tool{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--panel);border-radius:var(--r);padding:7px 9px;font-weight:700;min-height:40px}
.tool[aria-pressed=true]{border-color:var(--accent);background:var(--accent-soft)}
.sw{width:18px;height:18px;border-radius:4px;flex:none;border:1px solid var(--line)}
.sw.seat{background:var(--desk);border-color:var(--desk-line)} .sw.teacher{background:var(--teacher)} .sw.board{background:var(--board)}
.sw.window{background:repeating-linear-gradient(90deg,var(--glass) 0 4px,var(--glass-line) 4px 5px)} .sw.door{background:var(--panel);border-left:3px solid var(--ink)}
.sw.erase{background:var(--floor);border-style:dashed}
.stepper{display:flex;align-items:center;gap:4px}
.stepper button{width:34px;height:34px;border:1px solid var(--line);background:var(--panel);border-radius:6px;font-weight:700}
.stepper output{min-width:28px;text-align:center;font-variant-numeric:tabular-nums;font-weight:700}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:transparent;padding:4px 9px;min-width:36px;min-height:36px;font-weight:700;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink)}
.seg button:disabled{cursor:default}
.tableWrap{overflow-x:auto;margin-inline:-4px}
table.attrs{border-collapse:collapse;width:100%}
table.attrs th,table.attrs td{padding:6px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle;white-space:nowrap}
table.attrs th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
table.attrs td.c{font-weight:700;font-size:16px}
.check{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.check input{width:20px;height:20px;margin:1px 0 0;accent-color:var(--accent);flex:none}
.rules{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.rules li{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:6px;padding:4px 4px 4px 10px}
.rules li b{flex:1}
.tag{font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--ink)}
.tag.apart{background:color-mix(in srgb,var(--danger) 16%,var(--panel))}
.iconBtn{border:0;background:transparent;width:32px;height:32px;display:inline-flex;align-items:center;justify-content:center;border-radius:6px;color:var(--muted)}
.iconBtn:hover{background:var(--bg);color:var(--ink)}
.result{border:1px solid var(--line);border-radius:var(--r);padding:10px;font-size:13px;display:flex;flex-direction:column;gap:4px}
.result.ok{border-color:var(--ok);color:var(--ok);font-weight:700}
.result.bad{border-color:var(--lock)}
.result ul{margin:0;padding-left:18px}
.result .soft{color:var(--muted)}
.confirm{border:1px solid var(--danger);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:8px;background:color-mix(in srgb,var(--danger) 7%,var(--panel))}

/* empty + loading */
.emptyCard{max-width:520px;margin:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:28px;display:flex;flex-direction:column;gap:14px}
.emptyCard h2{font-size:26px}
.emptyCard p{margin:0;color:var(--muted);max-width:60ch}
.banner{background:color-mix(in srgb,var(--lock) 14%,var(--panel));border-bottom:1px solid var(--line);font-size:13px;padding-block:6px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--bg);
  border-radius:10px;padding:10px 14px;display:flex;gap:12px;align-items:center;box-shadow:0 8px 24px rgb(0 0 0 / .25);max-width:calc(100vw - 32px)}
.toast button{border:0;background:transparent;color:var(--bg);font-weight:700;text-decoration:underline;padding:4px}

/* presentation mode */
.present{position:fixed;inset:0;z-index:40;background:var(--bg);display:grid;grid-template-rows:auto 1fr;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.presentHead{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;padding-block:14px;
  padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.presentHead h1{font-size:clamp(26px,4vw,48px)}
.presentHead .meta{font-size:clamp(14px,1.6vw,20px)}

@media (max-width:760px){
  .app{height:auto;min-height:100%}
  .main{grid-template-columns:1fr}
  .side{order:2;border-right:0;border-top:1px solid var(--line);overflow:visible}
  .stage{order:1;padding:12px 8px;min-height:50vh}
  .tabs button{padding:6px 10px}
}
@media (prefers-reduced-motion:no-preference){
  .chip,.tool,.btn{transition:border-color .15s,background-color .15s}
}
</style>
</head>

}

/* ---------- room templates ---------- */
function frontRow(cells, cols){
  const bw = Math.min(cols, Math.max(3, Math.round(cols*0.4)));
  const bx = Math.floor((cols-bw)/2);
  for(let x=bx;x<bx+bw;x++) cells[key(x,0)]="board";
  cells[key(0,0)]="door";
  cells[key(cols-2,1)]="teacher"; cells[key(cols-1,1)]="teacher";
}
function template(kind, cols, rows){
  const c = {}; frontRow(c, cols);
  if(kind==="rows"){
    const n = Math.floor((cols+1)/3), used = n*3-1, off = Math.floor((cols-used)/2);
    for(let y=2;y<rows;y++) for(let i=0;i<n;i++){ c[key(off+i*3,y)]="seat"; c[key(off+i*3+1,y)]="seat"; }
  } else if(kind==="u"){
    for(let y=2;y<rows;y++){ c[key(0,y)]="seat"; c[key(cols-1,y)]="seat"; }
    for(let x=1;x<cols-1;x++) c[key(x,rows-1)]="seat";
    if(cols>=7 && rows>=6) for(let y=3;y<rows-2;y++){ c[key(Math.floor(cols/2)-1,y)]="seat"; c[key(Math.floor(cols/2),y)]="seat"; }
  } else if(kind==="groups"){
    for(let y=2;y+1<rows;y+=3) for(let x=0;x+1<cols;x+=3){ c[key(x,y)]=c[key(x+1,y)]=c[key(x,y+1)]=c[key(x+1,y+1)]="seat"; }
  }
  return c;
}

/* ---------- persistence ---------- */
let db = null;
const inflight = {}, pending = {};
function saveLocal(){ if(db) return; store.set("sp-local-v1", JSON.stringify({rooms:S.rooms, classes:S.classes})); }
function put(col, id, data){
  if(S.readOnly) return;
  if(data===null) delete S[col][id]; else S[col][id] = data;
  if(!db){ saveLocal(); return; }
  const p = col+"/"+id;
  pending[p] = data;
  if(!inflight[p]) pump(p);
}
async function pump(p){
  inflight[p]=true;
  while(Object.prototype.hasOwnProperty.call(pending,p)){
    const d = pending[p]; delete pending[p];
    try{ d===null ? await db.doc(p).delete() : await db.doc(p).set(d); }
    catch(e){
      const code = e && e.code;
      if(code==="unavailable"){ await new Promise(r=>setTimeout(r,600+Math.random()*800)); if(!Object.prototype.hasOwnProperty.call(pending,p)) pending[p]=d; continue; }
      if(code==="invalid_argument" || code==="not_granted"){ S.readOnly=true; render(); }
      toast(code==="quota_exceeded" ? t("quota") : t("writeFail"));
    }
  }
  inflight[p]=false;
}

/* ---------- derived ---------- */
const cls = () => S.classes[S.curClass] || null;
const roomOf = c => c && S.rooms[c.roomId] || null;
function seating(c){
  const r = roomOf(c), plan = {}, seated = new Set();
  const ids = new Set((c?.students||[]).map(s=>s.id));
  if(r) for(const [k,sid] of Object.entries(c.plan||{})) if(r.cells[k]==="seat" && ids.has(sid) && !seated.has(sid)){ plan[k]=sid; seated.add(sid); }
  return {plan, seated};
}
const student = (c,sid) => (c.students||[]).find(s=>s.id===sid);
function cleanPlan(c){ const {plan} = seating(c); const locked = (c.locked||[]).filter(sid => Object.values(plan).includes(sid)); return {plan, locked}; }
function saveClass(c){ c.updatedAt = Date.now(); put("classes", c.id, c); }

/* ---------- actions ---------- */
function moveStudent(sid, target){
  const c = cls(); if(!c || S.readOnly) return;
  const {plan} = seating(c); const locked = new Set(c.locked||[]);
  const from = Object.keys(plan).find(k=>plan[k]===sid);
  if(locked.has(sid)){ toast(t("pinnedMsg")); return; }
  if(target===from) return;
  if(target===null){ if(from) delete plan[from]; }
  else{
    const other = plan[target];
    if(other && locked.has(other)){ toast(t("pinnedMsg")); return; }
    plan[target]=sid;
    if(from){ if(other) plan[from]=other; else delete plan[from]; }
  }
  c.plan = plan; c.locked = [...locked].filter(id=>Object.values(plan).includes(id));
  S.sel = null; saveClass(c); render();
}
function togglePin(sid){
  const c = cls(); if(!c) return; const L = new Set(c.locked||[]);
  L.has(sid) ? L.delete(sid) : L.add(sid); c.locked=[...L]; saveClass(c); render();
}
function remember(c){ S.undo = {cid:c.id, plan:clone(c.plan), locked:[...(c.locked||[])]}; }
function doUndo(){ const u=S.undo; const c=S.classes[u?.cid]; if(!c) return; c.plan=u.plan; c.locked=u.locked; S.undo=null; saveClass(c); render(); }
function shuffle(){
  const c = cls(), r = roomOf(c); if(!c||!r) return; remember(c);
  const {plan} = seating(c); const L = new Set(c.locked||[]);
  const keep = {}; for(const [k,sid] of Object.entries(plan)) if(L.has(sid)) keep[k]=sid;
  const free = Object.keys(r.cells).filter(k=>r.cells[k]==="seat" && !keep[k]);
  const movers = (c.students||[]).map(s=>s.id).filter(id=>!L.has(id) || !Object.values(keep).includes(id));
  for(let i=movers.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [movers[i],movers[j]]=[movers[j],movers[i]]; }
  free.sort((a,b)=>{ const [ax,ay]=a.split(",").map(Number),[bx,by]=b.split(",").map(Number); return ay-by||ax-bx; });
  const next = {...keep}; movers.forEach((sid,i)=>{ if(free[i]) next[free[i]]=sid; });
  c.plan = next; S.sel=null; saveClass(c); render(); toast(t("shuffled"), t("undo"), doUndo);
}
function clearAll(){
  const c = cls(); if(!c) return; remember(c);
  const {plan} = seating(c); const L = new Set(c.locked||[]); const next={};
  for(const [k,sid] of Object.entries(plan)) if(L.has(sid)) next[k]=sid;
  c.plan=next; S.sel=null; saveClass(c); render(); toast(t("cleared"), t("undo"), doUndo);
}

let currentGrid = null;
function gridEl(r, mode, c, maxCell){
  const flip = mode!=="edit" && S.flip;
  const g = h("div",{class:"grid "+mode, role:"grid"});
  g.style.gridTemplateColumns = `repeat(${r.cols}, var(--cell))`;
  g.dataset.cols=r.cols; g.dataset.rows=r.rows; g.dataset.max=maxCell||110;
  const seat = c ? seating(c) : {plan:{}};
  const L = new Set(c?.locked||[]);
  for(let vy=0; vy<r.rows; vy++) for(let vx=0; vx<r.cols; vx++){
    const x = flip ? r.cols-1-vx : vx, y = flip ? r.rows-1-vy : vy, k = key(x,y);
    const type = r.cells[k] || "floor";
    const lk = key(flip?x+1:x-1, y), rk = key(flip?x-1:x+1, y);
    const tk = key(x, flip?y+1:y-1), bk = key(x, flip?y-1:y+1);
    const joins = type!=="floor" && type!=="door" && type!=="seat";
    const jl = joins && r.cells[lk]===type, jr = joins && r.cells[rk]===type, jt = joins && type!=="seat" && r.cells[tk]===type, jb = joins && type!=="seat" && r.cells[bk]===type;
    const vert = (jt||jb) && !(jl||jr);
    const cell = h("div",{class:`cell ${type}${jl?" jl":""}${jr?" jr":""}${jt?" jt":""}${jb?" jb":""}${vert?" vert":""}`, dataset:{cell:k}});
    const fill = h("div",{class:"fill"});
    if((type==="board"||type==="teacher") && !jl && !jt) fill.append(h("span",{class:"lbl",text: type==="board"?t("front"):t("desk")}));
    if(type==="door"){ fill.append(svg('<path d="M4 21V4"/><path d="M4 4a16 16 0 0 1 16 17" stroke-dasharray="2 3"/><path d="M2 21h20"/>', "70%")); fill.title=t("door"); }
    if(type==="seat" && c){
      const sid = seat.plan[k];
      if(sid){
        const s = student(c,sid); cell.classList.add("taken");
        if(L.has(sid)){ cell.classList.add("locked"); const pinEl = svg(IC.pin); pinEl.setAttribute("class","pin"); fill.append(pinEl); }
        if(S.sel===sid) cell.classList.add("sel");
        fill.append(h("div",{class:"code", dataset:{sid}, text:s?.code||"?"}));
      }
    }
    cell.append(fill); g.append(cell);
  }
  return g;
}
function fitGrid(){
  for(const g of document.querySelectorAll(".grid")){
    const host = g.closest(".stage"); if(!host) continue;
    const cols=+g.dataset.cols, rows=+g.dataset.rows, max=+g.dataset.max;
    const pw = host.clientWidth - 64, ph = host.clientHeight - 90;
    const narrow = window.innerWidth <= 760 && !g.closest(".present");
    let c = narrow ? pw/cols : Math.min(pw/cols, ph/rows);
    c = Math.max(narrow?30:34, Math.min(max, Math.floor(c)));
    g.style.setProperty("--cell", c+"px");
  }
}
new ResizeObserver(fitGrid).observe(document.body);

/* ---------- pointer: drag students & paint room ---------- */
let drag = null;
document.addEventListener("pointerdown", e => {
  if(e.button>0) return;
  const codeEl = e.target.closest(".code,.chip");
  const gridEdit = e.target.closest(".grid.edit .cell");
  if(gridEdit && !S.readOnly){ e.preventDefault(); startPaint(gridEdit.dataset.cell); return; }
  if(!codeEl || S.readOnly || S.present) return;
  const sid = codeEl.dataset.sid; if(!sid) return;
  drag = {sid, x:e.clientX, y:e.clientY, el:codeEl, ghost:null, over:null, id:e.pointerId};
});
document.addEventListener("pointermove", e => {
  if(S.paint){ const el = document.elementFromPoint(e.clientX,e.clientY)?.closest(".grid.edit .cell"); if(el) paintAt(el.dataset.cell); return; }
  if(!drag || e.pointerId!==drag.id) return;
  if(!drag.ghost){
    if(Math.hypot(e.clientX-drag.x, e.clientY-drag.y) < 6) return;
    const c = cls(); if((c.locked||[]).includes(drag.sid)){ toast(t("pinnedMsg")); drag=null; return; }
    drag.ghost = h("div",{class:"chip ghost", text: drag.el.textContent}); document.body.append(drag.ghost);
  }
  e.preventDefault();
  drag.ghost.style.left = e.clientX+"px"; drag.ghost.style.top = e.clientY+"px";
  const over = dropTarget(e.clientX,e.clientY);
  if(drag.over && drag.over!==over) drag.over.classList.remove("over");
  if(over){ over.classList.add("over"); } drag.over = over;
}, {passive:false});
function dropTarget(x,y){ const el = document.elementFromPoint(x,y); return el?.closest(".grid.plan .seat") || el?.closest(".pool") || null; }
document.addEventListener("pointerup", e => {
  if(S.paint){ commitPaint(); return; }
  if(!drag || e.pointerId!==drag.id) return;
  const d = drag; drag = null;
  if(!d.ghost){ tapStudent(d.sid); return; }
  d.ghost.remove(); d.over?.classList.remove("over");
  const tgt = dropTarget(e.clientX,e.clientY);
  if(!tgt) return;
  moveStudent(d.sid, tgt.classList.contains("pool") ? null : tgt.dataset.cell);
});
document.addEventListener("pointercancel", () => { if(drag?.ghost){ drag.ghost.remove(); drag.over?.classList.remove("over"); } drag=null; if(S.paint) commitPaint(); });
function tapStudent(sid){ S.sel = (S.sel===sid) ? null : sid; render(); }
document.addEventListener("click", e => {
  if(S.readOnly || S.present || !S.sel) return;
  if(e.target.closest(".code,.chip,button,select,input")) return;
  const seatEl = e.target.closest(".grid.plan .seat"); const pool = e.target.closest(".pool");

    shuf(movers.slice()).forEach((a,i)=>{ as[order[i]]=a; });
    const pos = new Array(N); as.forEach((a,i)=>{ if(a>=0) pos[a]=i; });
    let cur = cost(as,pos), T = 12;
    for(let it=0; it<iters && cur>0 && free.length>1; it++, T*=0.9993){
      const i = free[Math.random()*free.length|0], j = free[Math.random()*free.length|0];
      if(i===j || (as[i]<0 && as[j]<0)) continue;
      const a=as[i], b=as[j]; as[i]=b; as[j]=a; if(a>=0) pos[a]=j; if(b>=0) pos[b]=i;
      const nc = cost(as,pos);
      if(nc<=cur || Math.random()<Math.exp((cur-nc)/T)) cur=nc;
      else { as[i]=a; as[j]=b; if(a>=0) pos[a]=i; if(b>=0) pos[b]=j; }
    }
    if(cur<bestC){ bestC=cur; best=as.slice(); }
  }
  const next = {}; for(let i=0;i<NS;i++) if(best && best[i]>=0) next[G.seats[i].k] = studs[best[i]].id;
  return next;
}
function check(c, r, plan){
  const G = geometry(r), pos = {}; for(const [k,sid] of Object.entries(plan)) pos[sid]=G.idx.get(k);
  const code = id => student(c,id)?.code || "?"; const hard=[], soft=[];
  for(const p of (c.rules?.pairs||[])){ if(!student(c,p.a)||!student(c,p.b)) continue;
    const A = pos[p.a]!=null ? G.seats[pos[p.a]] : null, B = pos[p.b]!=null ? G.seats[pos[p.b]] : null;
    const dx = A&&B ? Math.abs(A.x-B.x) : 9, dy = A&&B ? Math.abs(A.y-B.y) : 9, v = {a:code(p.a), b:code(p.b)};
    if(p.t==="apart"){ if(dy===0&&dx===1) hard.push(t("vApart",v)); else if(dx<=1&&dy<=1) hard.push(t("vNear",v)); }
    else if(!(dy===0&&dx===1)) hard.push(t("vTogether",v)); }
  for(const s of (c.students||[])){ if(!s.zone) continue; const p=pos[s.id];
    if(p==null) hard.push(t("vUnseated",{a:s.code})); else if(!(s.zone==="front"?G.front:G.back).has(p)) hard.push(t(s.zone==="front"?"vFront":"vBack",{a:s.code})); }
  if(c.rules?.rotation && c.history?.length){ const prev = new Set(c.history.slice(-3).flatMap(x=>x.p)); const n = pairsOf(plan,G).filter(p=>prev.has(p)).length; if(n) soft.push(t("vRepeat",{n})); }
  return {hard, soft};
}
function runSmart(){
  const c = cls(), r = roomOf(c); if(!c||!r||S.busy) return;
  S.busy = true; render();
  setTimeout(()=>{
    try{
      remember(c);
      const G = geometry(r), cur = pairsOf(seating(c).plan, G).sort();
      const hist = (c.history||[]).slice(); const last = hist[hist.length-1];
      if(cur.length && (!last || last.p.join() !== cur.join())) hist.push({at:Date.now(), p:cur});
      c.history = hist.slice(-6);
      const next = solve(c, r);
      c.plan = next; c.locked = (c.locked||[]).filter(id=>Object.values(next).includes(id));
      const res = check(c, r, next); S.lastRun = {cid:c.id, ...res};
      S.sel = null; saveClass(c);
    } finally { S.busy = false; render(); }
    toast(S.lastRun.hard.length ? t("smartPartial",{k:S.lastRun.hard.length}).replace(/:$/,".") : t("smartDone"), t("undo"), ()=>{ S.lastRun=null; doUndo(); });
  }, 30);
}

      !ro && hist ? h("button",{class:"btn ghost",style:"min-height:30px;padding:4px 6px",onclick:()=>{ c.history=[]; saveClass(c); render(); toast(t("historyCleared")); },text:t("clearHistory")}) : null)));

      h("h2",{text:t("attrs")}), h("p",{text:t("attrsHint")}), h("p",{class:"hint",style:"margin:0",text:t("levelHint")}),
      h("div",{class:"tableWrap"}, h("table",{class:"attrs"},
        h("thead",{}, h("tr",{}, [" ",t("gender"),t("level"),t("daz"),t("zone")].map(x=>h("th",{text:x})))),
        h("tbody",{}, studs.map(s=>h("tr",{},

          h("td",{}, seg(G, s.g||null, v=>setAttr(c,s.id,"g",v), t("gender"), ro)),

          h("td",{}, seg([[true,"✓"]], s.daz?true:null, v=>setAttr(c,s.id,"daz",v), t("daz"), ro)),

/* ---------- PNG export (A4 landscape, print-friendly) ---------- */
let downloads = null;
async function exportPng(){
  const c = cls(), r = roomOf(c); if(!c||!r||!downloads) return;
  try{ await document.fonts.ready; }catch(e){}
  const W=2339, H=1654, M=110; const cv=document.createElement("canvas"); cv.width=W; cv.height=H; const x=cv.getContext("2d");
  const BODY='"Atkinson Hyperlegible", system-ui, sans-serif', DISP='"Bricolage Grotesque", system-ui, sans-serif';
  x.fillStyle="#fff"; x.fillRect(0,0,W,H);
  x.fillStyle="#111"; x.font=`700 72px ${DISP}`; x.textBaseline="alphabetic"; x.fillText(c.name, M, M+60);
  x.font=`400 34px ${BODY}`; x.fillStyle="#444";
  x.fillText(`${r.name} · ${today()} · ${S.flip?t("teacherView"):t("studentView")}`, M, M+112);
  const top = M+160, bottom = H-M-60, aw = W-2*M, ah = bottom-top;
  const cell = Math.floor(Math.min(aw/r.cols, ah/r.rows)); const gx = M+(aw-cell*r.cols)/2, gy = top+(ah-cell*r.rows)/2;
  x.strokeStyle="#999"; x.lineWidth=3; x.strokeRect(gx-8,gy-8,cell*r.cols+16,cell*r.rows+16);
  const {plan} = seating(c); const L=new Set(c.locked||[]); const flip=S.flip; const pad=Math.max(5,cell*0.07);
  const rr=(X,Y,w,hh,rad)=>{ x.beginPath(); x.roundRect ? x.roundRect(X,Y,w,hh,rad) : x.rect(X,Y,w,hh); };
  for(let vy=0;vy<r.rows;vy++) for(let vx=0;vx<r.cols;vx++){
    const cx = flip?r.cols-1-vx:vx, cy = flip?r.rows-1-vy:vy, k=key(cx,cy), type=r.cells[k]; if(!type) continue;
    const hj = type!=="door" && type!=="seat";
    const jl = hj && r.cells[key(flip?cx+1:cx-1,cy)]===type, jr = hj && r.cells[key(flip?cx-1:cx+1,cy)]===type;
    const vj = type!=="door" && type!=="seat";
    const jt = vj && r.cells[key(cx,flip?cy+1:cy-1)]===type, jb = vj && r.cells[key(cx,flip?cy-1:cy+1)]===type;
    const X=gx+vx*cell+(jl?0:pad), Y=gy+vy*cell+(jt?0:pad), w=cell-(jl?0:pad)-(jr?0:pad), hh=cell-(jt?0:pad)-(jb?0:pad);
    if(type==="seat"){ x.fillStyle="#F3E9D6"; x.strokeStyle="#9C8150"; x.lineWidth=2; rr(X,Y,w,hh,jl||jr||jt||jb?0:8); x.fill(); x.stroke();
      const sid=plan[k]; if(sid){ const s=student(c,sid); x.fillStyle="#111"; x.textAlign="center"; x.textBaseline="middle";
        let fs=Math.floor(cell*0.3); x.font=`700 ${fs}px ${BODY}`; while(x.measureText(s.code).width>cell-14 && fs>12){ fs-=2; x.font=`700 ${fs}px ${BODY}`; }
        x.fillText(s.code, gx+vx*cell+cell/2, gy+vy*cell+cell/2); if(L.has(sid)){ x.fillStyle="#B86E0A"; x.beginPath(); x.arc(X+w-12,Y+12,6,0,7); x.fill(); } } }
    else if(type==="board"){ x.fillStyle="#2F5446"; rr(X,Y,w,hh,4); x.fill(); if(!jl&&!jt){ x.fillStyle="#fff"; x.font=`700 ${Math.floor(cell*.2)}px ${BODY}`; x.textAlign="left"; x.textBaseline="middle"; x.fillText(t("front").toUpperCase(), X+12, Y+hh/2); } }
    else if(type==="teacher"){ x.fillStyle="#D7B98F"; rr(X,Y,w,hh,4); x.fill(); if(!jl&&!jt){ x.fillStyle="#2A1E10"; x.font=`700 ${Math.floor(cell*.2)}px ${BODY}`; x.textAlign="left"; x.textBaseline="middle"; x.fillText(t("desk").toUpperCase(), X+12, Y+hh/2); } }
    else if(type==="window"){ x.fillStyle="#DCEBF5"; x.fillRect(X,Y,w,hh); x.strokeStyle="#7FA9C6"; x.lineWidth=2;
      if((jt||jb)&&!(jl||jr)) for(let i=Y;i<Y+hh;i+=14){ x.beginPath(); x.moveTo(X,i); x.lineTo(X+w,i); x.stroke(); }
      else for(let i=X;i<X+w;i+=14){ x.beginPath(); x.moveTo(i,Y); x.lineTo(i,Y+hh); x.stroke(); } }
    else if(type==="door"){ x.strokeStyle="#555"; x.lineWidth=3; x.beginPath(); x.moveTo(X,Y+hh); x.lineTo(X,Y); x.stroke(); x.setLineDash([6,6]); x.beginPath(); x.arc(X,Y+hh,hh,-Math.PI/2,0); x.stroke(); x.setLineDash([]); }
  }
  const pool = (c.students||[]).filter(s=>!Object.values(plan).includes(s.id)).map(s=>s.code);
  x.textAlign="left"; x.textBaseline="alphabetic"; x.fillStyle="#444"; x.font=`400 28px ${BODY}`;
  x.fillText(pool.length ? `${t("unseated")}: ${pool.join(", ")}` : "", M, H-M+10);
  x.textAlign="right"; x.fillStyle="#999"; x.fillText(t("madeWith"), W-M, H-M+10);
  const blob = await new Promise(res=>cv.toBlob(res,"image/png"));
  const safe = (c.name||"Klasse").replace(/[^\p{L}\p{N}_-]+/gu,"_");
  try{ await downloads.save({filename:`Sitzplan_${safe}_${new Date().toISOString().slice(0,10)}.png`, data:blob}); toast(t("saved")); }
  catch(e){ toast(e?.code==="declined" ? t("dlDeclined") : t("dlFail")); }
}

/* ---------- boot (v3: Supabase, Frankfurt) ---------- */
const CFG = window.SITZPLAN_CONFIG || {};
let sb = null;
downloads = { async save({filename, data}){
  const blob = data instanceof Blob ? data : new Blob([data]);
  const url = URL.createObjectURL(blob); const a = document.createElement("a");
  a.href = url; a.download = filename; document.body.append(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 5000);
}};
function mapErr(error){
  const msg = (error && (error.message||"")) + "";
  if(error && (error.code==="42501" || /row-level security|permission denied/i.test(msg))) return {code:"not_granted", message:msg};
  if(/fetch|network|Failed to/i.test(msg)) return {code:"unavailable", message:msg};
  return {code:"write_failed", message:msg};
}
function makeDb(){
  return { doc(path){ const [col,id] = path.split("/"); return {
    async set(data){ const {error} = await sb.from("docs").upsert({collection:col, id, data, updated_at:new Date().toISOString(), updated_by:S.user||null}); if(error) throw mapErr(error); },
    async delete(){ const {error} = await sb.from("docs").delete().eq("collection",col).eq("id",id); if(error) throw mapErr(error); }
  }; } };
}
async function loadAll(){
  const {data, error} = await sb.from("docs").select("collection,id,data");
  if(error){ S.mode="offline"; S.got={rooms:true,classes:true}; render(); return; }
  const next = {rooms:{}, classes:{}};
  for(const r of data) if(next[r.collection]) next[r.collection][r.id] = r.data;
  for(const col of ["rooms","classes"]) for(const id of Object.keys(S[col])) if(inflight[col+"/"+id] || Object.prototype.hasOwnProperty.call(pending,col+"/"+id)) next[col][id] = S[col][id];
  S.rooms = next.rooms; S.classes = next.classes; S.got = {rooms:true, classes:true}; S.mode = "live"; render(true);
}
let channel = null;
function startSync(){
  db = makeDb();
  if(channel) sb.removeChannel(channel);
  channel = sb.channel("docs-sync")
    .on("postgres_changes", {event:"*", schema:"public", table:"docs"}, p => {
      const row = p.eventType==="DELETE" ? p.old : p.new; const col = row && row.collection;
      if(col!=="rooms" && col!=="classes") return;
      if(inflight[col+"/"+row.id] || Object.prototype.hasOwnProperty.call(pending,col+"/"+row.id)) return;
      if(p.eventType==="DELETE") delete S[col][row.id]; else S[col][row.id] = row.data;
      render(true);
    })
    .subscribe(status => {
      if(status==="SUBSCRIBED") loadAll();
      else if(status==="CHANNEL_ERROR" || status==="TIMED_OUT" || status==="CLOSED"){ S.mode="offline"; renderTop(); }
    });
}
function stopSync(){ if(channel){ sb.removeChannel(channel); channel=null; } db=null; S.rooms={}; S.classes={}; S.got={rooms:false,classes:false}; }
async function signOut(){ try{ await sb.auth.signOut(); }catch(e){} }
async function onSession(session){
  if(!session){ stopSync(); S.user=null; S.gate="login"; render(); return; }
  if(S.user===session.user.email && db) return;
  S.user = session.user.email; S.gate = null; S.mode = "connecting"; render();
  const {data:allowed, error} = await sb.rpc("am_i_allowed");
  if(error || !allowed){ S.gate = "denied"; render(); return; }
  startSync();
}
function renderGate(main){
  main.style.gridTemplateColumns = "1fr";
  let card;
  if(S.gate==="setup"){
    card = h("div",{class:"emptyCard"}, h("h2",{text:t("setupTitle")}), h("p",{text:t("setupBody")}));
  } else if(S.gate==="denied"){
    card = h("div",{class:"emptyCard"}, h("h2",{text:t("deniedTitle")}), h("p",{text:t("deniedBody",{x:S.user||""})}),
      h("div",{class:"row"}, h("button",{class:"btn",onclick:signOut,text:t("logout")})));
  } else {
    const msg = h("p",{class:"hint",role:"status"});
    const inp = h("input",{type:"email",id:"loginEmail",autocomplete:"email",required:true,placeholder:"name@schule.de",style:"font-size:16px"});
    const btn = h("button",{class:"btn primary",type:"submit",text:t("sendLink")});
    const form = h("form",{class:"stack",onsubmit: async e => {
      e.preventDefault(); const email = inp.value.trim(); if(!email) return;
      btn.disabled = true; msg.textContent = "";
      const {error} = await sb.auth.signInWithOtp({email, options:{emailRedirectTo: location.origin + location.pathname}});
      btn.disabled = false;
      if(error){ msg.textContent = /rate|limit|seconds/i.test(error.message) ? t("rateLimit") : t("loginFail"); msg.className="warn"; }
      else { msg.textContent = t("linkSent",{x:email}); msg.className="hint"; }
    }}, h("label",{class:"f"}, t("email"), inp), btn, msg);
    card = h("div",{class:"emptyCard"}, h("h2",{text:t("loginTitle")}), h("p",{text:t("loginBody")}), form);
  }
  main.replaceChildren(h("div",{class:"stage"}, card));
}

render();
(async () => {
  if(!CFG.url || !CFG.anonKey || !window.supabase){ S.gate="setup"; render(); return; }
  sb = window.supabase.createClient(CFG.url, CFG.anonKey, {auth:{persistSession:true, autoRefreshToken:true, detectSessionInUrl:true, flowType:"implicit"}});
  sb.auth.onAuthStateChange((_ev, session) => { setTimeout(()=>onSession(session), 0); });
  const {data} = await sb.auth.getSession();
  if(!data.session){ S.gate="login"; render(); }
})();
})();
